# Build the patched NVC this library needs, then analyse unisim and run
# the three self-checking benches. NVC_REPO and NVC_REF are the only
# places that select the simulator; upstream NVC does not yet simulate
# these models.

name: ci

on:
  push:
  pull_request:

env:
  NVC_REPO: https://github.com/amb5l/nvc
  # Branch tip. Integer overrides in config/type_map.yaml stay; this NVC
  # zero-extends an integer generic onto a sized Verilog parameter.
  NVC_REF: unisim/5-generics

jobs:
  unisim:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install NVC build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential automake autoconf flex check \
            llvm-dev pkg-config zlib1g-dev libdw-dev libffi-dev libzstd-dev

      - name: Resolve NVC revision
        id: nvc-rev
        run: |
          set -eu
          if [[ "$NVC_REF" =~ ^[0-9a-fA-F]{40}$ ]]; then
            sha=$NVC_REF
          else
            sha=$(git ls-remote "$NVC_REPO" "refs/heads/$NVC_REF" | awk 'NR==1 { print $1 }')
          fi
          if [ -z "${sha}" ]; then
            echo "could not resolve NVC_REF=$NVC_REF from $NVC_REPO" >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          llvm=$(llvm-config --version)
          echo "llvm=$llvm" >> "$GITHUB_OUTPUT"
          echo "NVC $sha (LLVM $llvm)"

      - name: Cache NVC install
        id: nvc-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/nvc-prefix
          key: nvc-${{ steps.nvc-rev.outputs.sha }}-llvm${{ steps.nvc-rev.outputs.llvm }}-${{ runner.os }}

      - name: Build NVC
        if: steps.nvc-cache.outputs.cache-hit != 'true'
        run: |
          set -eu
          src="${RUNNER_TEMP}/nvc-src"
          prefix="${RUNNER_TEMP}/nvc-prefix"
          rm -rf "$src"
          git init "$src"
          git -C "$src" remote add origin "$NVC_REPO"
          git -C "$src" fetch --depth 1 origin "$NVC_REF"
          git -C "$src" checkout --detach FETCH_HEAD
          cd "$src"
          ./autogen.sh
          mkdir build && cd build
          ../configure --prefix="$prefix"
          make -j"$(nproc)"
          make install

      - name: Put NVC on PATH
        run: echo "${RUNNER_TEMP}/nvc-prefix/bin" >> "$GITHUB_PATH"

      - name: Analyse unisim and run tests
        run: |
          set -eu
          nvc --version
          make
          make test
