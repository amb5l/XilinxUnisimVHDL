# Overrides for scripts/gen_vcomponents.py.
#
# The default mapping is:
#   string literal           -> string
#   unsized integer          -> integer
#   real literal             -> real
#   sized bit-vector literal -> std_logic_vector of that width
#
# NVC's mixed-language elaborator (the cursor/vlog-unisim-mixed branch)
# accepts only integer and string generics. A std_logic_vector generic
# analyses, then fails when the component is elaborated. The entries
# below are the exceptions found while simulating the primitives in
# test/tb: sized defaults whose value fits in VHDL INTEGER are passed
# as integer (zero-extended by the Verilog parameter), and a value that
# does not fit is skipped so the Verilog default is left alone.
#
# Forms:
#   MODULE:
#     PARAM: integer|string|real|std_logic_vector
#     PARAM:
#       type: std_logic_vector
#       width: 32
#       skip: true

RAM32X1D:
  INIT: integer
  IS_WCLK_INVERTED: integer

DSP48E1:
  IS_ALUMODE_INVERTED: integer
  IS_CARRYIN_INVERTED: integer
  IS_CLK_INVERTED: integer
  IS_INMODE_INVERTED: integer
  IS_OPMODE_INVERTED: integer
  PATTERN: integer
  # 48'h3FFFFFFFFFFF does not fit in INTEGER. Omit the generic;
  # elaboration keeps the Verilog default.
  MASK:
    skip: true

