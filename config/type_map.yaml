# Optional overrides for scripts/gen_vcomponents.py.
#
# The default mapping, used for every parameter while this file has no
# entries, is:
#   string literal           -> string
#   unsized integer          -> integer
#   real literal             -> real
#   sized bit-vector literal -> std_logic_vector of that width
#
# NVC unisim/5-generics elaborates string, integer, real, and
# std_logic_vector generics. A sized Verilog parameter still accepts an
# integer association (the value is zero-extended to the parameter
# width), but nothing here rewrites a vector parameter to integer.
# DSP48E1.MASK is therefore present as
# std_logic_vector(47 downto 0) := X"3FFFFFFFFFFF".
#
# Forms, if an override is needed again:
#   MODULE:
#     PARAM: integer|string|real|std_logic_vector
#     PARAM:
#       type: std_logic_vector
#       width: 32
#       skip: true
