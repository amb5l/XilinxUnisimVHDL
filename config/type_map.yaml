# Overrides for scripts/gen_vcomponents.py.
#
# The default mapping follows Vivado's unisim_VCOMP conventions:
#   string literal "TRUE" or "FALSE" -> boolean
#   any other string literal          -> string
#   unsized integer, or integer       -> integer
#   real literal, or real             -> real
#   1-bit sized literal               -> bit, default '0' or '1'
#   wider sized literal               -> bit_vector(N-1 downto 0)
#                                        default X"..." or "0101"
#
# An X or Z in a sized literal stays std_logic_vector, because bit and
# bit_vector cannot represent it. No such default is in this pin.
#
# There are no integer overrides. A sized parameter is no longer rewritten
# to integer, and DSP48E1 MASK is emitted (48-bit bit_vector).
#
# Forms, if a later primitive needs an exception:
#   MODULE:
#     PARAM: integer|string|real|boolean|std_logic_vector
#     PARAM:
#       type: std_logic_vector
#       width: 32
#       skip: true
